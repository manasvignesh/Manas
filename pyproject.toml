[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "manas"
version = "0.2.0"
description = "Many Agents, Networked Adaptive Society - a local-first synthetic society simulator."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "MANAS contributors"}]
dependencies = [
  "networkx>=3.2",
  "pydantic>=2.6",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
manas = "manas.cli.app:app"
crowdforge = "manas.cli.compat:legacy_command"

[tool.hatch.build.targets.wheel]
packages = ["manas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
