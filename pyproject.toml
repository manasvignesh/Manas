[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "crowdforge"
version = "0.1.0"
description = "A local-first synthetic society simulator for exploring ideas."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "CrowdForge contributors"}]
dependencies = [
  "networkx>=3.2",
  "pydantic>=2.6",
  "rich>=13.7",
  "textual>=0.65",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
crowdforge = "crowdforge.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["crowdforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

